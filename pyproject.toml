[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel consultant copilot for learning Agent engineering"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "langchain-core>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
