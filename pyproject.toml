[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel consultant copilot for learning Agent engineering"
requires-python = ">=3.12"
dependencies = [
  # alembic 放在主依赖而不是 dev 组：数据库迁移是部署步骤的一部分，
  # 镜像里必须能执行 `alembic upgrade head`。放 dev 组的话 Dockerfile
  # 只读 project.dependencies，装不进容器。
  "alembic>=1.13",
  "SQLAlchemy>=2.0",
  "psycopg-pool>=3.2",
  "psycopg[binary]>=3.2",
  "fastapi>=0.110",
  "langchain-core>=1.0",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "python-dotenv>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=3.0",
  "pydantic>=2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
